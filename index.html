<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
    <title>NS form</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Vul hier de gegevens in van de overledene</legend>
            <p>
                <label>Voorletter(s)*</label>
                <input type="text" required> 
            </p>
            <p>
                <label>Tussen-voegsel(s)</label>
                <input type="text">
            </p>
            <p>
                <label>Achternaam*</label>
                <input type="text" required>
            </p>
            <p>
                <label>Burgerservicenummer overledene*</label>
                <input type="text" pattern="[1-9][0-9]{8}" required>
            </p>

            <p>
                <label>Overlijdensdatum*</label>
                <input type="date" required>
            </p> 
        </fieldset>
    </form>
</body>
</html>
